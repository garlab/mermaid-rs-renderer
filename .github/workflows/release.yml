# Fork releases use a package-prefixed tag to avoid upstream's v* tags.
name: Release

on:
  push:
    tags: ['document-graphics-mermaid-v*']

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

env:
  TAG: ${{ github.ref_name }}

jobs:
  validate:
    if: github.repository == 'garlab/document-graphics-mermaid'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: stable
      - name: Check package, version tag and main ancestry
        run: bash .github/scripts/check-release.sh

  verify:
    needs: validate
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  publish:
    needs: [validate, verify]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: stable
      - name: Check whether the version is already published
        id: registry
        run: bash .github/scripts/check-published.sh >> "$GITHUB_OUTPUT"
      - name: Authenticate with crates.io
        if: steps.registry.outputs.published == 'false'
        id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
      # Verification built the archive before this job obtained a token. Avoid
      # running dependency build scripts or macros with registry credentials.
      - name: Publish crate
        if: steps.registry.outputs.published == 'false'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish -p document-graphics-mermaid --locked --no-verify
